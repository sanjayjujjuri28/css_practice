<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .gridContainer{
            height: 600px;
            width: 900px;
            background-color: rgb(255, 255, 255);
            margin: 150px auto;
            display: grid;
            grid-template-rows: repeat(3,200px);
            grid-template-columns: repeat(3,300px);
            gap: 3px;
        }
        .child{
            border: 3px solid black;
        }
    </style>
</head>
<body>
     <div class="gridContainer">
        <div class="child" style="background-color:blueviolet;"></div>
        <div class="child" style="background-color:rgb(224, 13, 210);"></div>
        <div class="child" style="background-color:rgb(231, 143, 20);"></div>
        <div class="child" style="background-color:rgb(214, 35, 15);"></div>
        <div class="child" style="background-color:rgb(19, 191, 39);"></div>
        <div class="child" style="background-color:rgb(11, 146, 204);"></div>
        <div class="child" style="background-color:rgb(7, 167, 93);"></div>
        <div class="child"  style="background-color:rgb(7, 90, 206);"></div>
        <div class="child" style="background-color:rgb(202, 175, 38);"></div>      
     </div>
</body>
</html>
