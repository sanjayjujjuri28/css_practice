<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .gridContainer{
            height: 600px;
            width: 900px;
            background-color: rgb(255, 255, 255);
            margin: 150px auto;
            display: grid;
            grid-template-rows: repeat(3,200px);
            grid-template-columns: repeat(3,300px);
            gap: 3px;
        }
        .child{
            border: 4px solid rgb(10, 10, 10);
            text-align: center;
            color: white;
            font-size: 3em;
            padding-top: 60px;
        }
    </style>
</head>
<body>
     <div class="gridContainer">
        <div class="child" id="violet" style="background-color:blueviolet;">A</div>
        <div class="child" style="background-color:rgb(224, 13, 210);">B</div>
        <div class="child" style="background-color:rgb(231, 143, 20);">C</div>
        <div class="child" style="background-color:rgb(214, 35, 15);">D</div>
        <div class="child" style="background-color:rgb(19, 191, 39);">E</div>
        <div class="child" style="background-color:rgb(11, 146, 204);">F</div>
        <div class="child" style="background-color:rgb(7, 167, 93);">G</div>
        <div class="child"  style="background-color:rgb(7, 90, 206);">H</div>
        <div class="child" style="background-color:rgb(202, 175, 38);">I</div>      
     </div>
</body>
</html>
