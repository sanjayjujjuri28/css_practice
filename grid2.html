<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        .gridContainer{
            height: 615px;
            width:1220px;
            background-color: darkgray;
            display: grid;
            grid-template-rows: repeat(3,200px);
            grid-template-columns: repeat(4,300px);
            border: 2px solid black;
            gap: 5px;
            margin: 100px auto;
        }
        .child{

        }
        #first{
            grid-column: 1/3;
            background-color: blue;
            color: white;
            text-align: center;
            padding-top: 60px;
            font-size: 2em;
        }
        #second{
            grid-column: 3/4;
            grid-row: 1/3;
            background-color: violet;
             color: white;
            text-align: center;
            padding-top: 150px;
            font-size: 2em;
        }
        #third{
            background-color: rgb(28, 188, 188);
            color: white;
            text-align: center;
            padding-top: 60px;
            font-size: 2em;
        }
        #fourth{
            grid-column: 1/3;
            background-color: orange;
            color: white;
            text-align: center;
            padding-top: 60px;
            font-size: 2em;
        }
        #fifth{
            grid-column: 4/5;
            background-color: rgb(16, 235, 122);
             color: white;
            text-align: center;
            padding-top: 60px;
            font-size: 2em;
        }
        #six{
            background-color: skyblue;
            grid-column: 1/5;
             color: white;
            text-align: center;
            padding-top: 60px;
            font-size: 2em;
        }
    </style>
</head>
<body>
     <div class="gridContainer">
        <div class="child" id="first">A<br>grid-column:&nbsp;1/3;</div>
        <div class="child" id="second">B<br>grid-row:&nbsp;1/3;</div>
        <div class="child" id="third">C<br>grid-column:&nbsp;4/5;</div>
        <div class="child" id="fourth">D<br>grid-column:&nbsp;1/3;</div>
        <div class="child" id="fifth">E<br>grid-column:&nbsp;4/5;</div>
        <div class="child" id="six">F<br>grid-column:&nbsp;1/5;</div>
     </div>
</body>
</html>
